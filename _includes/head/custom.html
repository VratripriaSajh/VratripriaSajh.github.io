<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<script>
(function () {
  function markCurrentPage() {
    function cleanPath(path) {
      path = path.split('?')[0].split('#')[0];
      if (path.endsWith('/index.html')) path = path.slice(0, -10);
      if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
      return path || '/';
    }

    var currentPath = cleanPath(window.location.pathname);
    document.querySelectorAll('nav a[href]').forEach(function (link) {
      var linkPath;
      try {
        linkPath = cleanPath(new URL(link.getAttribute('href'), window.location.origin).pathname);
      } catch (error) {
        return;
      }
      if (linkPath === currentPath) {
        link.setAttribute('aria-current', 'page');
        link.classList.add('is-current-page');
      } else {
        link.removeAttribute('aria-current');
        link.classList.remove('is-current-page');
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', markCurrentPage);
  } else {
    markCurrentPage();
  }
})();
</script>
